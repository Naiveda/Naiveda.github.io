outputs:
  home:
    - HTML
    - RSS
    - JSON
baseURL: "https://naiveda.github.io/"
languageCode: "zh-cn"
title: "Naiveda"
theme: ["PaperMod"]

enableRobotsTXT: true

params:
  env: production
  description: "记录学习、思考与实践"
  defaultTheme: auto

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.25
    distance: 50
    minMatchCharLength: 2
    keys:
      - title
      - summary
      - content

  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true

  homeInfoParams:
    Title: "你好 👋"
    Content: "记录学习、思考与实践。"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10

    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20

    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30

    - identifier: search
      name: 搜索
      url: /search/
      weight: 40

    - identifier: about
      name: 关于
      url: /about/
      weight: 50

caches:
  images:
    dir: :cacheDir/images
