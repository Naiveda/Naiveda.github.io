baseURL: "https://naiveda.github.io/"
title: "Naiveda"
theme: ["PaperMod"]

defaultContentLanguage: zh

languages:
  zh:
    locale: "zh-CN"
    label: "简体中文"
    weight: 1

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags

params:
  env: production
  author: "Naiveda"
  description: "记录学习、思考与实践"
  defaultTheme: auto
  disableThemeToggle: false
  DateFormat: "2006 年 1 月 2 日"

  mainSections:
    - posts
    - notes

  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.25
    distance: 50
    minMatchCharLength: 2
    keys:
      - title
      - summary
      - content

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: notes
      name: 笔记
      url: /notes/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50
    - identifier: about
      name: 关于
      url: /about/
      weight: 60

caches:
  images:
    dir: :cacheDir/images
